<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee; --surface: #fff; --surface-2: #faf8f4; --ink: #17201f; --ink-2: #4b5654; --ink-3: #7c8684;
    --line: #e4e0d7; --brand: #0d5c56; --brand-ink: #fff; --accent: #c8452c; --ok: #2f855a; --bad: #c53030;
    --focus: #0d5c5655; --shadow: 0 1px 2px rgba(23,32,31,.05), 0 8px 24px -12px rgba(23,32,31,.18); --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1514; --surface: #172020; --surface-2: #1c2626; --ink: #eef2f0; --ink-2: #b5c0bd; --ink-3: #85918e;
      --line: #2a3533; --brand: #4fb3a8; --brand-ink: #0b1312; --accent: #ff8a6f; --ok: #5cc28a; --bad: #ff7b7b;
      --focus: #4fb3a866; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1514; --surface: #172020; --surface-2: #1c2626; --ink: #eef2f0; --ink-2: #b5c0bd; --ink-3: #85918e;
    --line: #2a3533; --brand: #4fb3a8; --brand-ink: #0b1312; --accent: #ff8a6f; --ok: #5cc28a; --bad: #ff7b7b;
    --focus: #4fb3a866; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--brand); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  .narrow { max-width: 520px; }

  .top { border-bottom: 1px solid var(--line); background: var(--surface); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand svg { color: var(--accent); }
  .brand b { font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 600; }
  .brand span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  nav a, nav button { font: 500 14px Inter, sans-serif; color: var(--ink-2); text-decoration: none; padding: 7px 10px; border-radius: 8px; background: none; border: 0; cursor: pointer; }
  nav a:hover, nav button:hover { background: var(--surface-2); color: var(--ink); }

  main { padding: 36px 0 72px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(28px, 4.4vw, 42px); line-height: 1.08; letter-spacing: -.02em; margin: 0 0 10px; }
  h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
  h3 { font-size: 15px; margin: 0 0 4px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); margin-bottom: 10px; }
  .muted { color: var(--ink-3); }
  .lede { color: var(--ink-2); max-width: 62ch; }
  .small { font-size: 13px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .stack > * + * { margin-top: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  label.f { display: block; font-weight: 500; font-size: 14px; margin-bottom: 14px; }
  label.f small { font-weight: 400; color: var(--ink-3); margin-left: 4px; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=search], select, textarea {
    display: block; width: 100%; margin-top: 6px; height: 44px; padding: 0 12px; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  textarea { height: auto; min-height: 140px; padding: 10px 12px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--focus); }
  .inline input, .inline select { display: inline-block; width: auto; margin: 0; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); margin: 14px 0; }
  .check input { margin-top: 4px; width: 16px; height: 16px; flex: none; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; font: 600 14px Inter, sans-serif;
    border-radius: 10px; border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink); cursor: pointer; text-decoration: none; }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--brand); }
  .btn.quiet { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
  .btn.danger { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .btn.sm { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
  .btn.block { width: 100%; }

  .pill { display: inline-block; font: 600 11px/1 Inter, sans-serif; letter-spacing: .05em; text-transform: uppercase; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: transparent; }
  .pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: transparent; }
  .pill.brand { color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, transparent); border-color: transparent; }

  .msg { padding: 12px 14px; border-radius: 10px; font-size: 14px; margin: 12px 0; }
  .msg.err { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
  .msg.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .msg.info { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

  .progress { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }

  .module { display: flex; flex-direction: column; gap: 10px; }
  .module .meta { font-size: 13px; color: var(--ink-3); }
  .module .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }

  .q { border-top: 1px solid var(--line); padding-top: 18px; }
  .q:first-child { border-top: 0; padding-top: 0; }
  .q .stem { font-weight: 600; margin-bottom: 10px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; cursor: pointer; background: var(--surface); }
  .opt:hover { border-color: var(--ink-3); }
  .opt input { margin-top: 4px; }
  .opt.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .expl { font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-left: 3px solid var(--brand); padding: 8px 12px; border-radius: 0 8px 8px 0; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
  .tabs a { padding: 10px 14px; text-decoration: none; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a.on { color: var(--brand); border-bottom-color: var(--brand); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  code.k { font: 600 14px ui-monospace, Menlo, monospace; background: var(--surface-2); border: 1px solid var(--line); padding: 3px 8px; border-radius: 6px; letter-spacing: .05em; }

  dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0,0,0,.4); width: min(720px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(10, 15, 14, .45); }
  dialog .body { padding: 22px; max-height: 80vh; overflow: auto; }

  /* Certificate */
  .cert { background: #fffdf8; color: #1d2422; border: 1px solid #d9d2c3; border-radius: 6px; padding: 48px 56px; position: relative; max-width: 900px; margin: 0 auto;
    box-shadow: 0 20px 50px -24px rgba(0,0,0,.35); }
  .cert::before { content: ""; position: absolute; inset: 12px; border: 2px solid #0d5c56; border-radius: 3px; pointer-events: none; }
  .cert .org { font: 600 12px Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #0d5c56; }
  .cert .title { font-family: Fraunces, Georgia, serif; font-size: 40px; font-weight: 600; margin: 14px 0 4px; letter-spacing: -.01em; }
  .cert .name { font-family: Fraunces, Georgia, serif; font-size: 34px; margin: 18px 0 4px; border-bottom: 1px solid #cfc7b6; display: inline-block; padding: 0 18px 6px; }
  .cert .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 36px; }
  .cert ul { margin: 8px 0 0; padding-left: 18px; }
  .cert .qr img, .cert .qr canvas { width: 108px !important; height: 108px !important; }
  .cert .sig { border-top: 1px solid #1d2422; padding-top: 6px; min-width: 200px; font-size: 13px; }

  #sharebox:fullscreen, #sharebox:-webkit-full-screen { background: #fff; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; }
  #sharebox:fullscreen > div:first-child::after { content: " — scan to join"; }
  #sharebox:fullscreen img, #sharebox:fullscreen canvas { width: min(62vh, 80vw) !important; height: min(62vh, 80vw) !important; }
  #sharebox:-webkit-full-screen img { width: min(62vh, 80vw) !important; height: min(62vh, 80vw) !important; }
  #sharebox:fullscreen [style*="46px"] { font-size: 9vh !important; color: #111; }
  #joinqr img { display: block; }

  .center { text-align: center; }
  .hide { display: none !important; }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  #toast.on { opacity: 1; }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .brand span { display: none; }
    .cert { padding: 32px 24px; }
    .cert .title { font-size: 30px; }
    .cert .name { font-size: 26px; }
    .cert .foot { flex-direction: column; align-items: flex-start; }
  }
  @media print {
    .top, .noprint, #toast { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
    .cert { box-shadow: none; border: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">
      <svg width="26" height="14" viewBox="0 0 44 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 13h10l3-7 5 15 5-19 4 11h15"/></svg>
      <b>Class Portal</b><span>Emergency Medicine</span>
    </a>
    <nav id="nav"></nav>
  </div>
</header>
<main><div class="wrap" id="app"><div class="spinner"></div></div></main>
<div id="toast" role="status"></div>
<dialog id="dlg"><div class="body" id="dlg-body"></div></dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
